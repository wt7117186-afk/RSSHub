name: Claude 监事

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # 每个 PR 提交或更新时，Claude 自动按任务单审核
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            你是公司的监事 Claude。先读 AGENTS.md 和 roles/claude-监事.md。

            1. 从 PR 描述里的 `Closes #<编号>` 找到任务单 Issue，用 `gh issue view <编号> --comments` 读完整任务单。
            2. 用 `gh pr diff` 看实际改动，对照验收标准逐条检查。
            3. 用 `gh pr comment` 在 PR 里按 roles/claude-监事.md 的格式写审核结论（通过 / 退回）。
            4. 更新 Issue 标签：
               - 通过：`gh issue edit <编号> --remove-label 待审核 --add-label 待老板批准`，并在 Issue 里留言 @${{ github.repository_owner }} 请老板合并。
               - 退回：`gh issue edit <编号> --remove-label 待审核 --add-label 退回`，并在 Issue 里留言说明要改什么，请 Muse 安排返工。
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),mcp__github_inline_comment__create_inline_comment"

  # 任何人在 Issue / PR 留言里 @claude，Claude 作为顾问回应
  ask:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
